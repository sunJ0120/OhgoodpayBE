version: '3.8'

services:
  redis:
    build:
      context: ./redis-docker
      dockerfile: Dockerfile
    container_name: ohgoodpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis-docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - ohgoodpay-network

  mysql:
    image: mysql:8.4
    container_name: ohgoodpay-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ohgood}
      MYSQL_DATABASE: ohgoodpay
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - ohgoodpay-network

volumes:
  redis_data:
    driver: local
  mysql_data:
    driver: local

networks:
  ohgoodpay-network:
    driver: bridge