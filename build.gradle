plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

// Docker Engine 29(최소 API 1.44)와 호환되는 Testcontainers (Boot 3.5.3 기본 1.21.2는 Docker 29 를 인식하지 못한다)
ext['testcontainers.version'] = '1.21.4'

group = 'com.ohgoodteam'
version = '0.0.1-SNAPSHOT'
description = 'BNPL Service for Spring Boot'

java {
	toolchain {
        languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-gson:0.12.6'

    // OpenFeign/querydsl 최신 fork 기반으로 변경
    implementation("io.github.openfeign.querydsl:querydsl-jpa:7.1")
    annotationProcessor("io.github.openfeign.querydsl:querydsl-apt:7.1:jakarta")
    annotationProcessor("jakarta.annotation:jakarta.annotation-api")
    annotationProcessor("jakarta.persistence:jakarta.persistence-api")

	// Swagger/OpenAPI 설정
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

	// AWS SDK 설정
	implementation "software.amazon.awssdk:s3:2.25.54"
    implementation "software.amazon.awssdk:sts:2.25.54"

	// FastAPI 호출(WebClient)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// YAML 바인딩 자동완성/메타데이터
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// Qr Zing 라이브러리
	implementation 'com.google.zxing:core:3.5.2'
	implementation 'com.google.zxing:javase:3.5.2'

    // DB 마이그레이션 (llm 스키마: 프롬프트 버전·호출 기록). 프롬프트는 Flyway INSERT 로만 추가한다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 레거시 테스트(H2)용
    runtimeOnly 'com.h2database:h2'

    // DB 테스트 (MySQL Testcontainers)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}

tasks.named('test') {
	useJUnitPlatform()
}

// QueryDSL 설정, 한 번 비워주고 Q클래스가 생길 수 있도록 해야 한다.
clean {
	delete file('src/main/generated')
	delete file('build/generated')
}
